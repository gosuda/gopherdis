name: Redis Compatibility

env:
  REDIS_SUITE_TAG: "8.10.1"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# The badge on this workflow is the project's compatibility claim, so every step
# below has to be able to fail the build. Nothing here is allowed to end in
# "|| true".
jobs:
  unit:
    name: Go unit tests (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -timeout 10m ./...

  differential:
    name: 1:1 differential suite vs C Redis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install C Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release curl gpg
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y redis-server
          redis-server --version

      # Replays each command against both servers and compares the raw RESP
      # bytes, so a divergence fails the build.
      - name: Run differential suite
        run: go test -v -race -timeout 5m ./tests

  official:
    name: Redis official Tcl suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Units that gopherdis passes end to end today. Adding a unit here is
        # the way compatibility progress gets recorded, and a regression in one
        # of them turns the badge red.
        unit:
          - unit/type/incr
          - unit/networking
          - unit/quit
          - unit/keyspace
          - unit/type/set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Tcl and redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y tcl tcl-tls lsb-release curl gpg
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y redis-tools

      - name: Build gopherdis
        run: go build -o bin/gopherdis-server ./cmd/gopherdis-server

      # Pinned to a release tag on purpose. The default branch is `unstable`,
      # which carries unreleased commands, so tracking it would make the
      # compatibility target move under us.
      - name: Check out the official Redis test suite
        run: git clone --depth 1 --branch ${{ env.REDIS_SUITE_TAG }} https://github.com/redis/redis.git /tmp/redis-src

      - name: Run ${{ matrix.unit }}
        run: |
          # pipefail matters: the tcl runner's exit status is the gate, and
          # piping it into tee would otherwise report tee's status instead.
          set -eo pipefail

          ./bin/gopherdis-server -port 16380 &
          GOPHERDIS_PID=$!
          trap 'kill $GOPHERDIS_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            redis-cli -p 16380 PING >/dev/null 2>&1 && break
            sleep 0.2
          done
          redis-cli -p 16380 PING

          cd /tmp/redis-src
          # --singledb: gopherdis exposes a single database, so the suite must
          # not try to SELECT 9 the way it does against stock Redis.
          # --singledb: gopherdis exposes a single database, so the suite must
          #   not try to SELECT 9 the way it does against stock Redis.
          # -needs:debug: those tests inspect Redis internals through DEBUG,
          #   such as hash table rehashing state and dict chain lengths, which
          #   have no counterpart here. Faking the DEBUG output to satisfy them
          #   would assert nothing.
          tclsh tests/test_helper.tcl \
            --host 127.0.0.1 --port 16380 \
            --singledb \
            --tags "-needs:debug" \
            --single ${{ matrix.unit }} 2>&1 | tee /tmp/out.log

          # The runner exits non-zero on assertion failures, which pipefail
          # propagates. This also catches a missing command aborting the unit
          # early with a Tcl exception.
          if ! grep -q "All tests passed without errors" /tmp/out.log; then
            echo "::error::${{ matrix.unit }} did not pass the official Redis suite"
            exit 1
          fi

          # A unit whose tags exclude it in external-server mode runs nothing and
          # still prints "All tests passed", which would make this job green
          # while asserting nothing. Require that real tests executed.
          # sed strips the runner's ANSI colouring so [ok] is matchable.
          EXECUTED=$(sed 's/\x1b\[[0-9;]*m//g' /tmp/out.log | grep -c '^\[ok\]' || true)
          echo "${{ matrix.unit }} executed $EXECUTED tests"
          if [ "$EXECUTED" -lt 1 ]; then
            echo "::error::${{ matrix.unit }} executed no tests, so it verifies nothing"
            exit 1
          fi
